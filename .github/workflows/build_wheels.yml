name: Build wheels

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  pull_request:
  workflow_dispatch:  # Allow manual triggering

env:
  CIBW_BEFORE_BUILD: "pip install -U pip setuptools wheel"
  CIBW_BUILD_VERBOSITY: 1
  # The wheel tag is py3-none-<platform>: the bundled tools are standalone
  # executables with no Python ABI dependency, so one wheel per platform covers
  # every supported interpreter. Building more would just collide on filename.
  CIBW_BUILD: "cp312-*"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel




      - name: Build wheels
        env:
          CIBW_BEFORE_BUILD: "pip install -U pip setuptools wheel"
        run: |

          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          path: wheelhouse/*.whl
          name: wheels-${{ matrix.os }}

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install build

      - name: Build source distribution
        run: |
          python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.tar.gz
          name: sdist

